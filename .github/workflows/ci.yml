name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements.txt

      - name: Lint (syntax + undefined names)
        run: ruff check src/ --select=E9,F63,F7,F82 --ignore=F401

      - name: Import check
        run: python -c "import src.indexer_smart; import src.engine_smart; print('OK')"

      # test_ai_core (dormant MiDaS) eagerly loads a heavy model and is skipped.
      # test_processor self-skips when torch/CUDA are absent (importorskip +
      # skipif), so it is safe to collect on the headless runner.
      - name: Run tests
        run: python -m pytest tests/ --ignore=tests/test_ai_core.py -q
